name: Prüfung

# Läuft bei jedem Push und Pull Request. Verhindert, dass ein Syntaxfehler
# oder eine kaputte Kernlogik auf GitHub Pages landet – die Seite wird ohne
# Build-Schritt ausgeliefert, es gibt also keine zweite Instanz, die das
# abfängt.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruefung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax aller JavaScript-Dateien
        run: |
          fehler=0
          for f in js/*.js tests/*.mjs; do
            if node --check "$f"; then
              echo "  ok   $f"
            else
              echo "  FEHLER $f"; fehler=1
            fi
          done
          exit $fehler

      - name: Einlesen der Arbeitsmappe (Kopfzeilen, Zeilennummern)
        run: node tests/test-excel.mjs

      - name: Umwandlungen (deutsche Zahlen, Datum, leer/null/Null)
        run: node tests/test-transforms.mjs

      - name: Aufbau der Nutzlast (Schlüssel, Schreibregeln, Lookups)
        run: node tests/test-mapping.mjs

      - name: Auflösungsphase (Sammelabfragen, Filterfeld, Rückfallweg)
        run: node tests/test-aufloesung.mjs

      - name: Batch-Format (Aufbau und Auswertung)
        run: node tests/test-batch.mjs

      - name: Prüflauf (Einstufung neu/geändert/unverändert/übersprungen)
        run: node tests/test-pruefung.mjs

      - name: Importlauf (neu angelegte Elterndatensätze, Ausschluss)
        run: node tests/test-lauf.mjs

      - name: Dublettenprüfung der Schlüsselfelder
        run: node tests/test-dubletten.mjs

      - name: Konfiguration, Ladereihenfolge und Doku auf Konsistenz prüfen
        run: node tests/test-konsistenz.mjs
