name: Automatischer Import

# Sieht nach, ob neue Mappen im Quellordner liegen, prueft sie und
# importiert die unstrittigen. Ob ein Lauf wirklich etwas tut, entscheidet
# NICHT dieser Zeitplan, sondern die Liste CRM_Automatik in SharePoint:
# dort stehen Schalter, Takt, Zeitfenster und Wochentage. Eine Taktaenderung
# ist damit eine Eingabe im Werkzeug und kein Pull Request.
#
# ACHTUNG, gemessen am 06.10.2026: "*/15" steht hier als Absicht, nicht als
# Zusage. Von 96 moeglichen Ausloesungen am Tag materialisiert GitHub
# tatsaechlich rund FUENF, zu beliebigen Minuten (68 Laeufe in 13 Tagen).
# Am Donnerstag, 01.10., waren es 02:15, 08:14, 15:18, 20:56 und 00:58
# deutscher Zeit - genau einer davon lag im eingestellten Fenster 4 bis 14
# Uhr. Wer hier ein enges Zeitfenster einstellt, verlaesst sich auf einen
# Zeitplan, den es nicht gibt. Deshalb steht das Fenster in CRM_Automatik
# weit offen, und die Fehlanzeige holt eine verpasste Frist nach.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      erzwingen:
        description: "Takt und Zeitfenster uebergehen"
        type: boolean
        default: true
      trocken:
        description: "Nur pruefen und berichten, nichts schreiben"
        type: boolean
        default: false
      stichtag:
        description: "Stichtag nur fuer DIESEN Lauf (JJJJ-MM-TT), z. B. um eine aeltere Mappe zu pruefen"
        type: string
        default: ""
      umgebung:
        description: "Zielumgebung nur fuer DIESEN Lauf"
        type: choice
        options: ["wie in js/config.js", "TEST", "PROD"]
        default: "wie in js/config.js"

# Solange die Secrets fehlen, steigt das Skript sauber aus (Exit 0) statt zu
# scheitern: ein roter Lauf viermal je Stunde waere eine Fehlermail fuer
# etwas, das niemand kaputt gemacht hat. Was fehlt, steht im Protokoll.

# Zwei Laeufe gleichzeitig wuerden dieselbe Datei zweimal importieren.
concurrency:
  group: crm-automatik
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: SheetJS installieren
        run: npm install --prefix cron --no-audit --no-fund
      - name: Import-Lauf
        working-directory: cron
        env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          CRM_ERZWINGEN: ${{ (github.event_name == 'workflow_dispatch' && inputs.erzwingen) && '1' || '0' }}
          CRM_TROCKEN:   ${{ (github.event_name == 'workflow_dispatch' && inputs.trocken) && '1' || '0' }}
          # Nur beim manuellen Start gesetzt - ein Zeitplanlauf haelt sich
          # immer an das, was in SharePoint steht.
          CRM_ABDATUM:   ${{ github.event_name == 'workflow_dispatch' && inputs.stichtag || '' }}
          # Umlenken gilt nur fuer DIESEN Lauf. Ein Zeitplanlauf schreibt
          # immer dorthin, wo js/config.js hinzeigt - eine Umgebung, die vom
          # zuletzt gewaehlten Knopf abhaengt, waere nicht nachvollziehbar.
          CRM_DATAVERSE_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.umgebung == 'TEST') && 'https://dihag-test.crm4.dynamics.com' || ((github.event_name == 'workflow_dispatch' && inputs.umgebung == 'PROD') && 'https://dihag-prod.crm4.dynamics.com' || '') }}
          CRM_UMGEBUNG:      ${{ (github.event_name == 'workflow_dispatch' && inputs.umgebung != 'wie in js/config.js') && inputs.umgebung || '' }}
        run: node automatik.mjs
