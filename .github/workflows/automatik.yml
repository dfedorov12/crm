name: Automatischer Import

# Sieht nach, ob neue Mappen im Quellordner liegen, prueft sie und
# importiert die unstrittigen. Ob ein Lauf wirklich etwas tut, entscheidet
# NICHT dieser Zeitplan, sondern die Liste CRM_Automatik in SharePoint:
# dort stehen Schalter, Takt, Zeitfenster und Wochentage. Eine Taktaenderung
# ist damit eine Eingabe im Werkzeug und kein Pull Request.
#
# ZEITPLAN: gleichmaessig verteilt, weil der Zeitpunkt nicht steuerbar ist.
#
# Am 22.10.2026 gemessen, und das ist die Zahl, auf die es ankommt: ein
# TAEGLICHER Cron (ZAPP, "0 5 * * *") lief an 20 von 20 Tagen - aber im
# Median 5h48 ZU SPAET, zwischen 3h54 und 7h33. GitHub liefert einen
# sparsamen Zeitplan also zuverlaessig ab und haelt ihn nur nicht ein.
#
# Zum Vergleich der enge Takt, der hier bis zum 22.10. stand: "*/15" bat um
# 96 Ausloesungen und bekam FUENF bis ACHT, zu beliebigen Minuten, Luecken
# im Mittel 4,3 und hoechstens 9,4 Stunden. Dasselbe Bild von der anderen
# Seite.
#
# Daraus zwei Schluesse. Erstens: eine Uhrzeit anzupeilen ist zwecklos. Die
# erste Fassung dieser Datei stellte morgens zwei Zeiten dicht hintereinander,
# weil Timeline donnerstags um 06:00 liefert - sie waeren gegen 11 bis 13 Uhr
# gelaufen. Zweitens: steuerbar ist nur der GROESSTE ABSTAND. Deshalb acht
# Zeiten in gleichen Abstaenden von drei Stunden, zur Minute 17 (die volle
# Stunde ist bei GitHub die Hauptlast). Die Verspaetung trifft dann alle acht
# gleich und verschiebt das Raster, ohne es auszureissen.
#
# Ob gearbeitet wird, entscheidet weiter CRM_Automatik in SharePoint:
# Schalter, Takt, Zeitfenster, Wochentage. Eine Taktaenderung ist eine
# Eingabe im Werkzeug und kein Pull Request. Das Zeitfenster steht wegen
# alldem offen (0-23 Uhr), und die Fehlanzeige holt eine verpasste Frist nach.
#
# Soll der Import binnen Minuten nach der Ablage starten, fuehrt kein Weg an
# einem Anstoss von aussen vorbei. Mit GitHubs Zeitplan ist das nicht zu
# haben, und zwar nicht durch eine geschicktere Cron-Zeile (siehe docs/11).

on:
  schedule:
    - cron: "17 1,4,7,10,13,16,19,22 * * *"

  # Anstoss von aussen, fuer den Fall, dass der Import binnen Minuten nach
  # der Ablage laufen soll. Heute ruft das niemand; die Zeile steht hier,
  # damit es spaeter keine Codeaenderung braucht, sondern nur einen Sender
  # (docs/11). Alle Eingaben unten sind auf workflow_dispatch eingegrenzt,
  # ein so angestossener Lauf verhaelt sich deshalb wie ein planmaessiger:
  # Takt, Zeitfenster und Schalter entscheidet weiter CRM_Automatik.
  repository_dispatch:
    types: [mappe-eingegangen]
  workflow_dispatch:
    inputs:
      erzwingen:
        description: "Takt und Zeitfenster uebergehen"
        type: boolean
        default: true
      trocken:
        description: "Nur pruefen und berichten, nichts schreiben"
        type: boolean
        default: false
      stichtag:
        description: "Stichtag nur fuer DIESEN Lauf (JJJJ-MM-TT), z. B. um eine aeltere Mappe zu pruefen"
        type: string
        default: ""
      umgebung:
        description: "Zielumgebung nur fuer DIESEN Lauf"
        type: choice
        options: ["wie in js/config.js", "TEST", "PROD"]
        default: "wie in js/config.js"

# Solange die Secrets fehlen, steigt das Skript sauber aus (Exit 0) statt zu
# scheitern: ein roter Lauf viermal je Stunde waere eine Fehlermail fuer
# etwas, das niemand kaputt gemacht hat. Was fehlt, steht im Protokoll.

# Zwei Laeufe gleichzeitig wuerden dieselbe Datei zweimal importieren.
concurrency:
  group: crm-automatik
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: SheetJS installieren
        run: npm install --prefix cron --no-audit --no-fund
      - name: Import-Lauf
        working-directory: cron
        env:
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          CRM_ERZWINGEN: ${{ (github.event_name == 'workflow_dispatch' && inputs.erzwingen) && '1' || '0' }}
          CRM_TROCKEN:   ${{ (github.event_name == 'workflow_dispatch' && inputs.trocken) && '1' || '0' }}
          # Nur beim manuellen Start gesetzt - ein Zeitplanlauf haelt sich
          # immer an das, was in SharePoint steht.
          CRM_ABDATUM:   ${{ github.event_name == 'workflow_dispatch' && inputs.stichtag || '' }}
          # Umlenken gilt nur fuer DIESEN Lauf. Ein Zeitplanlauf schreibt
          # immer dorthin, wo js/config.js hinzeigt - eine Umgebung, die vom
          # zuletzt gewaehlten Knopf abhaengt, waere nicht nachvollziehbar.
          CRM_DATAVERSE_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.umgebung == 'TEST') && 'https://dihag-test.crm4.dynamics.com' || ((github.event_name == 'workflow_dispatch' && inputs.umgebung == 'PROD') && 'https://dihag-prod.crm4.dynamics.com' || '') }}
          CRM_UMGEBUNG:      ${{ (github.event_name == 'workflow_dispatch' && inputs.umgebung != 'wie in js/config.js') && inputs.umgebung || '' }}
        run: node automatik.mjs
